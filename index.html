<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalorieBot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Определение калорий по фото</h1>
    <input type="file" id="photoInput" accept="image/*" capture="environment">
    <button id="uploadBtn">Сделать фото</button>
    <button id="galleryBtn">Выбрать из галереи</button>

    <div id="weightInput" class="weight hidden">
      <label for="dishWeight">Введите вес блюда (в граммах):</label>
      <input type="number" id="dishWeight" placeholder="Например: 250">
    </div>

    <div id="result" class="result glass-card hidden"></div>

    <div class="actions glass-card hidden">
      <button id="saveBtn">Сохранить блюдо</button>
      <button id="historyBtn">История</button>
    </div>

    <div id="history" class="history glass-card hidden">
      <h2>История блюд</h2>
      <ul id="historyList"></ul>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="script.js"></script>
</body>
</html>
